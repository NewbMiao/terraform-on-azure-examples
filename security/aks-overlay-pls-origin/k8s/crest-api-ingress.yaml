# hostname matches the AFD custom domain; TLS terminates at the edge, plain HTTP inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crest-api
spec:
  ingressClassName: nginx
  rules:
    - host: crest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crest-api
                port:
                  number: 80
