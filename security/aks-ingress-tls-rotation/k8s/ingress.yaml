# The Ingress only references the Secret name; TLS terminates at the edge, plain HTTP inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crest-api-dev
  namespace: ingress-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-dev.crest.example.com
      secretName: crest-tls-dev
  rules:
    - host: api-dev.crest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crest-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crest-api-prod
  namespace: ingress-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.crest.example.com
      secretName: crest-tls-prod
  rules:
    - host: api.crest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crest-api
                port:
                  number: 80
